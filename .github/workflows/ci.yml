name: ci
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `bubblewrap` is required (not merely nice-to-have): the installer-sandbox tests in `runtime-installer`
      # (`crate::sandbox`, `crate::pipeline`, `crate::uninstall`) gate on `bwrap` being on `$PATH` and otherwise
      # skip loudly rather than failing, so without this and RUNTIME_REQUIRE_BWRAP below, CI could go green while
      # never actually running them. `desktop-file-utils` (provides `desktop-file-validate`) is required for the
      # same reason: `runtime-desktop`'s `.desktop`-writer tests gate on it and RUNTIME_REQUIRE_DESKTOP_FILE_VALIDATE
      # below, the identical convention.
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 bubblewrap desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: tools/build-fixtures.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Plain `cargo test` skips the `#[ignore]`d real-Wine tests; the `wine-e2e` job runs them.
      # RUNTIME_REQUIRE_BWRAP=1 turns a missing `bwrap` into a hard test failure instead of the default
      # loud-skip-and-pass, so the real-sandbox tests above are guaranteed to actually execute here.
      - run: cargo test --workspace
        env:
          RUNTIME_REQUIRE_BWRAP: "1"
          RUNTIME_REQUIRE_DESKTOP_FILE_VALIDATE: "1"
  # Real-Wine end-to-end tests (`#[ignore]`d, so the `test` job never runs them). HEADLESS: only the console
  # fixtures run (hello*.exe, fs*.exe); the GUI fixture gui64.exe opens a modal dialog and is never executed.
  # NOTE: this job has NOT yet run on a real GitHub runner (written and checked locally against Wine 10.0 on
  # Linux only). ubuntu-latest may ship Wine 9 (`wineserver64`, no new WoW64): the tests then skip their 32-bit
  # steps with a `SKIPPED 32-bit` message. `continue-on-error` keeps a failure here from blocking a pull request
  # until one green run on a real runner shows the job is stable; then remove it.
  wine-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      WINEDEBUG: "-all"
    steps:
      - uses: actions/checkout@v4
      # Task 8's real-Wine installer e2e tests (`e2e_installers.rs`) need `nsis` (makensis) and `wixl`
      # (a SEPARATE apt package from `msitools` on this system's split, confirmed by this session's own
      # install history and by `tools/build-fixtures.sh`'s own error hint: "sudo apt install msitools
      # wixl") to build `hello.msi`/`hello-nsis.exe`, `bubblewrap` for the installer sandbox
      # (`rt_installer::sandbox`), and `desktop-file-utils` (`desktop-file-validate`) for the
      # `.desktop`-entry checks, matching the `test` job's already-established convention.
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 wine64 nsis msitools wixl bubblewrap desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/build-fixtures.sh
      # Only the crates with real-Wine tests: `--workspace --ignored` would also run the runtime-pe oracle tests,
      # which need RUNTIME_SAMPLES (a directory of real binaries) and fail without it. `-p runtime-cli` already
      # picks up every `#[ignore]`d test under `crates/cli/tests/`, `e2e_installers.rs` included, the same way it
      # already picks up `e2e_wine.rs`'s: there is no per-file allowlist, `cargo test -p <crate>` runs every
      # integration-test binary of that crate. RUNTIME_REQUIRE_BWRAP/RUNTIME_REQUIRE_DESKTOP_FILE_VALIDATE match
      # the `test` job's own convention (Tasks 6/7's fix rounds), so a runner missing either tool fails loudly
      # instead of the installer-pipeline/`.desktop` tests silently skip-and-passing.
      - run: cargo test -p runtime-backend-wine -p runtime-cli -- --ignored --test-threads=1 --nocapture
        env:
          RUNTIME_REQUIRE_BWRAP: "1"
          RUNTIME_REQUIRE_DESKTOP_FILE_VALIDATE: "1"
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
