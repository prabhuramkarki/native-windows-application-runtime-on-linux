name: ci
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `bubblewrap` is required (not merely nice-to-have): the installer-sandbox tests in `runtime-installer`
      # (`crate::sandbox`, `crate::pipeline`, `crate::uninstall`) gate on `bwrap` being on `$PATH` and otherwise
      # skip loudly rather than failing, so without this and RUNTIME_REQUIRE_BWRAP below, CI could go green while
      # never actually running them. `desktop-file-utils` (provides `desktop-file-validate`) is required for the
      # same reason: `runtime-desktop`'s `.desktop`-writer tests gate on it and RUNTIME_REQUIRE_DESKTOP_FILE_VALIDATE
      # below, the identical convention. `nsis`/`msitools`/`wixl` are required too, not just nice-to-have for
      # `wine-e2e`: `tools/build-fixtures.sh` (run unconditionally below) hard-`exit 1`s without `makensis`/`wixl`,
      # and several NON-`#[ignore]`d tests in this very job (e.g. `apps.rs`'s
      # `install_of_a_real_msi_is_routed_to_the_installer_pipeline_and_fails_cleanly_without_msiexec`) read
      # `hello.msi`/`hello-nsis.exe`/`hello-nsis-noshortcut.exe` off disk — without these packages the
      # fixture-build step itself fails before `cargo test` ever runs, taking down the whole
      # (non-`continue-on-error`) job.
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis msitools wixl bubblewrap desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: tools/build-fixtures.sh
      - run: cargo fmt --all -- --check
      # `runtime-gui` needs GTK 4 development files; the `gui` job below builds, lints and tests it.
      - run: cargo clippy --workspace --exclude runtime-gui --all-targets -- -D warnings
      # Plain `cargo test` skips the `#[ignore]`d real-Wine tests; the `wine-e2e` job runs them.
      # RUNTIME_REQUIRE_BWRAP=1 turns a missing `bwrap` into a hard test failure instead of the default
      # loud-skip-and-pass, so the real-sandbox tests above are guaranteed to actually execute here.
      # `runtime-deps`' real-bwrap tests run the installer sandbox with the built `runtime` binary as its
      # `sandbox-init` shim (target/debug/runtime); `cargo test --workspace --exclude runtime-gui` builds it (runtime-cli has integration
      # tests), and those tests fail loudly when it is missing.
      - run: cargo test --workspace --exclude runtime-gui
        env:
          RUNTIME_REQUIRE_BWRAP: "1"
          RUNTIME_REQUIRE_DESKTOP_FILE_VALIDATE: "1"
  # Real-Wine end-to-end tests (`#[ignore]`d, so the `test` job never runs them). HEADLESS: no display. The GUI
  # fixture gui64.exe runs only as the dependency engine's "hanging installer" (its message box waits on Wine's
  # null-driver desktop until the 20 s deadline kills the sandbox); the other fixtures are console programs.
  #
  # THIS JOB DOES NOT GATE ANYTHING (`continue-on-error`). It has run on a hosted runner once (commit 9cf1e27,
  # 2026-09-26) and passed; everything in it was verified locally, on Ubuntu 26.04 with its own Wine 10.0
  # (10.0~repack-12ubuntu1) and bubblewrap 0.11.1.
  # Remove `continue-on-error` only after green hosted runs show it is stable.
  #
  # Why a container: the real-Wine tests need Wine 10 (the dependency tests refuse anything older up front), and
  # `ubuntu-latest` (24.04) ships Wine 9. WineHQ's own packages are NOT used on purpose: they install Wine under
  # `/opt/wine-*`, which the installer sandbox does not bind (only `/usr`, `/bin`, `/lib*`, `/etc/alternatives`
  # and the backend's DLL directories, see docs/SECURITY.md), so every sandboxed installer run would fail for a
  # reason unrelated to the code under test. The job therefore runs in the Ubuntu 26.04 image, whose distro Wine
  # 10 is exactly the packaging the tests were verified with. `--privileged` lets bubblewrap create its
  # namespaces inside the container (unprivileged user namespaces are blocked by Docker's default seccomp
  # profile). The container runs as root; that the real-Wine tests all behave the same as root is unverified.
  wine-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    container:
      image: ubuntu:26.04
      options: --privileged
    env:
      WINEDEBUG: "-all"
      DEBIAN_FRONTEND: noninteractive
    steps:
      # `git` and `curl`/`ca-certificates` for the checkout and toolchain actions, `build-essential` for ring's C
      # code. Task 8's real-Wine installer e2e tests (`e2e_installers.rs`) need `nsis` (makensis) and `wixl` (a
      # SEPARATE apt package from `msitools`) to build `hello.msi`/`hello-nsis.exe`/`hello-nsis-noshortcut.exe`,
      # `bubblewrap` for the installer sandbox, and `desktop-file-utils` (`desktop-file-validate`) for the
      # `.desktop`-entry checks, matching the `test` job's convention.
      - run: apt-get update && apt-get install -y git curl ca-certificates build-essential mingw-w64 wine wine64 nsis msitools wixl bubblewrap desktop-file-utils
      - uses: actions/checkout@v4
      - run: wine --version
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/build-fixtures.sh
      # Only the crates with real-Wine tests: `--workspace --ignored` would also run the runtime-pe oracle tests,
      # which need RUNTIME_SAMPLES (a directory of real binaries) and fail without it. `-p runtime-cli` already
      # picks up every `#[ignore]`d test under `crates/cli/tests/`, `e2e_installers.rs` included, the same way it
      # already picks up `e2e_wine.rs`'s: there is no per-file allowlist, `cargo test -p <crate>` runs every
      # integration-test binary of that crate. RUNTIME_REQUIRE_BWRAP/RUNTIME_REQUIRE_DESKTOP_FILE_VALIDATE match
      # the `test` job's own convention (Tasks 6/7's fix rounds), so a runner missing either tool fails loudly
      # instead of the installer-pipeline/`.desktop` tests silently skip-and-passing.
      # `--skip real_net_`: `e2e_sandbox.rs`'s `real_net_wine_d3d11_renders_under_the_default_sandbox` needs the
      # internet (the DXVK download), a display and a Vulkan device; it is run by hand (docs/COMPAT.md).
      - run: cargo test -p runtime-backend-wine -p runtime-cli -- --ignored --skip real_net_ --test-threads=1 --nocapture
        env:
          RUNTIME_REQUIRE_BWRAP: "1"
          RUNTIME_REQUIRE_DESKTOP_FILE_VALIDATE: "1"
      # The dependency engine's real-Wine tests (Phase 4A Tasks 5/6/8: archive install + DLL override via reg.exe,
      # sandboxed NSIS installer with file and registry markers, exe installers on the null-driver desktop: exact
      # arguments, marker-only failure, deadline kill; fixtures `exports64.dll`/`dep-installer.exe`/`fs64.exe`/
      # `gui64.exe` come from `tools/build-fixtures.sh` above). The `e2e_real_wine` filter keeps out the other
      # ignored tests of this crate, which need the internet: `real_download_smoke` and every `real_net_*` test
      # (they download the bundled packages; the weekly `verify-pins.yml` workflow re-fetches the pins instead).
      # The filter also selects the orchestrator-level e2e (`orchestrate::tests::e2e::e2e_real_wine_*`: consent,
      # denied/tampered downloads against the local HTTPS test server, second run, killed-install discard, app
      # removal, installer-registered service kept in the sandbox). These tests check the Wine version first and
      # FAIL up front with a clear message on Wine < 10 (they were verified on Wine 10.0 only).
      # The installer sandbox runs the built `runtime` binary as its `sandbox-init` shim (Phase 5B Task 6); these
      # tests look for it in target/debug and fail loudly without it (`cargo test -p runtime-deps` does not build it).
      - run: cargo build -p runtime-cli
      - run: cargo test -p runtime-deps --lib -- --ignored e2e_real_wine --test-threads=1 --nocapture
        env:
          RUNTIME_REQUIRE_BWRAP: "1"
          RUNTIME_REQUIRE_DESKTOP_FILE_VALIDATE: "1"
  # The GUI client (`runtime-gui`, GTK 4 + libadwaita): ubuntu-latest (24.04) has GTK 4.14 and libadwaita 1.5, the
  # crate's minimum (features v4_12 / v1_5). Its e2e tests drive the real `runtimed` and `runtime` (built first) with
  # the fixtures; the widget tests run under Xvfb, and RUNTIME_REQUIRE_DISPLAY=1 makes a missing display a failure
  # instead of a loud skip. Screenshots (RUNTIME_GUI_SHOTS) are uploaded for a look, never asserted on.
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb mingw-w64 nsis msitools wixl bubblewrap desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: tools/build-fixtures.sh
      - run: cargo clippy -p runtime-gui --all-targets -- -D warnings
      - run: cargo build -p runtime-daemon -p runtime-cli
      - run: xvfb-run -a cargo test -p runtime-gui
        env:
          RUNTIME_REQUIRE_DISPLAY: "1"
          RUNTIME_GUI_SHOTS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-smoke
          path: target/gui-smoke/
          if-no-files-found: ignore
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
