[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false
# as_chunks needs 1.88 (is_multiple_of 1.87)
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
libc = "0.2"
# Only stored + deflate: no bzip2/zstd/lzma/aes/zopfli and no `time`. zip's own `deflate` feature selects
# zlib-rs (licence `Zlib`, not in deny.toml), so the pure-Rust miniz_oxide backend (MIT OR Zlib OR Apache-2.0) is
# chosen explicitly through the direct `flate2` dependency (runtime-core enables feature `rust_backend`).
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure-Rust zstd decoder for `.tar.zst` packages (`runtime-deps`, `tarball.rs`). `hash` (twox-hash, only needed to
# compute the content checksum, which the decoder never verifies itself) is left out: the package's sha256 is.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
sha2 = { version = "0.11", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Test-only TLS server for the fetch tests (runtime-deps dev-dependencies): same rustls/ring as ureq, no aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

# Zip tests inflate/deflate hundreds of MiB; unoptimised miniz_oxide would take minutes.
[profile.dev.package.miniz_oxide]
opt-level = 3
