[graph]
targets = ["x86_64-unknown-linux-gnu"]

[licenses]
# ISC: ring, rustls-webpki, untrusted; BSD-3-Clause: subtle; CDLA-Permissive-2.0: webpki-roots (Mozilla CA data).
# All three texts read in Phase 4A Task 0: permissive, notice-only conditions.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# No workspace code loads plugins or backends dynamically (Phase 6D, Decision B7; docs/SECURITY.md): backends are
# compiled in. `crates/core/tests/conformance.rs` scans the sources for the same thing. (System libraries still load
# their own modules: GTK/GLib in runtime-gui, glibc NSS.)
deny = [
    { crate = "libloading", reason = "no plugins: backends are compiled in" },
    { crate = "libloading-mini", reason = "no plugins: backends are compiled in" },
    { crate = "dlopen", reason = "no plugins: backends are compiled in" },
    { crate = "dlopen2", reason = "no plugins: backends are compiled in" },
]

# target-lexicon (via system-deps -> cfg-expr) runs only in the gtk-rs `-sys` build scripts of `runtime-gui`; it is
# never linked into a binary (`cargo tree --workspace -i target-lexicon -e normal` is empty). The LLVM exception only relaxes
# Apache-2.0's attribution for compiled output. Scoped to this one crate, not a global allow.
[[licenses.exceptions]]
crate = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]
