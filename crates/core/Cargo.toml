[package]
name = "runtime-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "rt_core"

[features]
# Compiles `fake::FakeBackend` (a test double) into the crate. Other crates enable it ONLY through a
# dev-dependency, so it is never part of a default or release build of a dependent.
testing = []

[dependencies]
runtime-pe = { path = "../pe" }
flate2.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"
sha2.workspace = true
zip.workspace = true

[dev-dependencies]
# `tests/conformance.rs` only: the suite and `FakeBackend` (`testing`), the installer pipeline's refusal of a
# backend by capability.
runtime-core = { path = ".", features = ["testing"] }
runtime-installer = { path = "../installer" }
tempfile.workspace = true
