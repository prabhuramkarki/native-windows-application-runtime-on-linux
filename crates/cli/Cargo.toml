[package]
name = "runtime-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "runtime"
path = "src/main.rs"

[dependencies]
runtime-pe = { path = "../pe" }
runtime-core = { path = "../core" }
runtime-installer = { path = "../installer" }
runtime-desktop = { path = "../desktop" }
runtime-backend-wine = { path = "../backend-wine" }
runtime-deps = { path = "../deps" }
runtime-sandbox = { path = "../sandbox" }
runtime-api = { path = "../api" }
# `.wrun` packages: `pack`, `inspect`, `unpack`, `import`.
runtime-package = { path = "../package" }
# The `runtimed` client (`runtime rpc`, `runtime daemon-status`) only; no other command needs the daemon.
runtime-daemon = { path = "../daemon" }
clap = { version = "4", features = ["derive"] }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `FakeBackend` for the unit tests of the front end (never part of a normal build).
runtime-core = { path = "../core", features = ["testing"] }
tempfile.workspace = true
sha2.workspace = true
zip.workspace = true
