[package]
name = "runtime-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "runtime"
path = "src/main.rs"

[dependencies]
runtime-pe = { path = "../pe" }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
