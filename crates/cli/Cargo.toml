[package]
name = "runtime-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "runtime"
path = "src/main.rs"

[dependencies]
runtime-pe = { path = "../pe" }
runtime-core = { path = "../core" }
runtime-backend-wine = { path = "../backend-wine" }
clap = { version = "4", features = ["derive"] }
libc.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `FakeBackend` for the unit tests of the front end (never part of a normal build).
runtime-core = { path = "../core", features = ["testing"] }
tempfile.workspace = true
zip.workspace = true
