# Run by hand on 2026-09-26 (same Wine, a Wayland desktop session) with
#   DXVK_FILTER_DEVICE_NAME=<device> cargo test -p runtime-deps --lib -- --ignored real_net_wine_d3d11 --test-threads=1 --nocapture
# once per Vulkan device of the host (`vulkaninfo --summary`). Needs a display: with DISPLAY and WAYLAND_DISPLAY
# unset, Wine 10.0's winevulkan cannot create a Vulkan instance and D3D11CreateDevice fails (0x80004005).

[[record]]
app = "d3d11 clear fixture (tools/fixtures/d3d11.c)"
status = "works"
wine = "10.0 (Ubuntu 10.0~repack-12ubuntu1)"
graphics = true
gpu = "NVIDIA GeForce RTX 3050 6GB Laptop GPU / NVIDIA 595.91.07 (Vulkan 1.4.329)"
evidence = "manual:2026-09-26"
notes = "DXVK 3.1.1 (x64): offscreen D3D11 FL 11_0 clear of a 64x64 target, read back: pixel ok, exit 0; frame ms: 0.0043 (100 clear+Flush, informational). DXVK created its device on this GPU."

