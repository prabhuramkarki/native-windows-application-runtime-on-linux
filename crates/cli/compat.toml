# The compatibility matrix: what was really run, on which Wine, with what result. One [[record]] per observation.
# Rules (checked by `Compat::parse`, and by a test on this very file): `evidence` is `ci:<job>` (a CI job run that
# passed) or `manual:<YYYY-MM-DD>` (run by hand on that date on the recorded Wine/GPU) and is required for
# works/partial/broken; `gpu` is required when `graphics = true`; no two records share (app, version, wine, gpu).
# Add only what someone actually ran; do not guess.
# After editing, regenerate the published table:
#   cargo run -q -p runtime-cli -- compat > docs/COMPAT.md
# (the test `compat_md_matches_records` fails until you do).

# The records below were run by hand on 2026-09-26 (Ubuntu Wine 10.0~repack-12ubuntu1, no GPU) with the two test
# commands of the `wine-e2e` CI job. That job is configured but has not yet run on a hosted runner, so none of them
# claims `ci:`.


[[record]]
app = "hello64.exe (fixture)"
status = "works"
wine = "10.0 (Ubuntu 10.0~repack-12ubuntu1)"
evidence = "manual:2026-09-26"
notes = "runtime install + run of a 64-bit console program: prints its greeting, exits 7 (e2e_mvp_loop_install_list_run_logs_doctor_remove). Also run by the wine-e2e CI job (configured, not yet run on a hosted runner)."

