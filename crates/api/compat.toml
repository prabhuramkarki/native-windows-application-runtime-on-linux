app = "hello64.exe (fixture)"
status = "works"
wine = "10.0 (Ubuntu 10.0~repack-12ubuntu1)"
evidence = "manual:2026-09-26"
notes = "runtime install + run of a 64-bit console program: prints its greeting, exits 7 (e2e_mvp_loop_install_list_run_logs_doctor_remove); also under the default sandbox (Phase 5A). Also run by the wine-e2e CI job (configured, not yet run on a hosted runner)."

