# Bundled dependency manifest. Every entry is checked by `Manifest::parse` and by the
# `bundled_manifest_invariants` / `bundled_manifest_has_no_placeholder_pins` tests, so an invalid file cannot ship.
#
# Every pin below (url, sha256, size) was verified by downloading the artifact on 2026-09-25 (Task 8); the
# ignored test `real_net_bundled_packages_refetch_and_match` re-downloads each one through the real fetcher.
# Nothing here is redistributed by the project: a package is downloaded from its upstream url only when the
# user asks for it (and, for a consent-gated package, accepts its licence).

# DXVK 3.1.1 (Direct3D 8/9/10/11 on Vulkan), upstream release tarball. Only the x64 DLLs are installed (the prefix
# is win64; 32-bit apps are a known gap). The sha256 equals GitHub's asset digest for this release.
[[package]]
id = "dxvk"
version = "3.1.1"
sha256 = "40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608"
size = 18041512
licence = "Zlib"
url = "https://github.com/doitsujin/dxvk/releases/download/v3.1.1/dxvk-3.1.1.tar.gz"
kind = "archive"
requires_consent = false
requires = []
# min_vulkan is a floor, not the upstream recommendation. The DXVK 3.0 release notes (2026-06-25, "Driver support")
# say the 3.x series requires Vulkan 1.4 features and extensions, and the DXVK wiki (Driver-support, 3.x) says "a
# compatible driver should support Vulkan 1.4" (and Wine 10.1+ for winevulkan), but that older AMD GCN cards keep
# working without advertising 1.4. Blocking at 1.4 would wrongly send those cards to wined3d, so the block is
# at 1.3, the lowest version a working setup can have.
min_vulkan = "1.3"
provides = ["d3d8", "d3d9", "d3d10core", "d3d11", "dxgi"]

[package.install]
format = "tar.gz"
extract = [
    { from = "dxvk-3.1.1/x64/d3d8.dll", to = "windows/system32/d3d8.dll" },
    { from = "dxvk-3.1.1/x64/d3d9.dll", to = "windows/system32/d3d9.dll" },
    { from = "dxvk-3.1.1/x64/d3d10core.dll", to = "windows/system32/d3d10core.dll" },
    { from = "dxvk-3.1.1/x64/d3d11.dll", to = "windows/system32/d3d11.dll" },
    { from = "dxvk-3.1.1/x64/dxgi.dll", to = "windows/system32/dxgi.dll" },
]
dll_overrides = ["d3d8", "d3d9", "d3d10core", "d3d11", "dxgi"]

# VKD3D-Proton 3.0.1 (Direct3D 12 on Vulkan), upstream release tarball (.tar.zst only, read by the bounded zstd
# reader). Verified by downloading on 2026-09-26; the sha256 equals GitHub's asset digest for this release. Only the
# x64 DLLs are installed (win64 prefix). Licence: the release's COPYING is the LGPL, "version 2.1 or (at your option)
# any later version". The 4A consent model gives permissive/open archives false; nothing is linked or redistributed
# (the DLLs are fetched from upstream on request), so no consent is required. It requires dxvk (DXGI, D3D11 on
# Vulkan) and, like dxvk, needs Vulkan 1.3 to render; installing works on any host.
[[package]]
id = "vkd3d-proton"
version = "3.0.1"
sha256 = "3cf2315522af5e43605ef6d3c41dad91387040bf97199934f3f7ab76caaa2f0c"
size = 5163266
licence = "LGPL-2.1-or-later"
url = "https://github.com/HansKristian-Work/vkd3d-proton/releases/download/v3.0.1/vkd3d-proton-3.0.1.tar.zst"
kind = "archive"
requires_consent = false
requires = ["dxvk"]
min_vulkan = "1.3"
provides = ["d3d12", "d3d12core"]

[package.install]
format = "tar.zst"
extract = [
    { from = "vkd3d-proton-3.0.1/x64/d3d12.dll", to = "windows/system32/d3d12.dll" },
    { from = "vkd3d-proton-3.0.1/x64/d3d12core.dll", to = "windows/system32/d3d12core.dll" },
]
dll_overrides = ["d3d12", "d3d12core"]

# Microsoft Visual C++ 2015-2022 Redistributable (x64) 14.44.35211. The url is the final, versioned
# download.visualstudio.microsoft.com location that https://aka.ms/vs/17/release/vc_redist.x64.exe redirected to on
# 2026-09-25 (its path embeds the file's sha256), so it does not move; if Microsoft removes it, the fetch fails
# safe (hash or HTTP error) and the pin must be refreshed.
# provides: the base names the x64 "Minimum" and "Additional" runtime MSIs inside the bundle install into
# system32 (their File tables; a real run installed all 16 as native DLLs). The MFC locale resource DLLs
# (mfc140enu, ...) are never imported.
# marker: a dword the Minimum runtime MSI writes (its Registry table: Bld = #35211); absent in a fresh Wine 10.0
# prefix and dword:0000898b (35211) after a real silent run of this exact file through `install_installer_pkg`. The
# file marker windows/system32/vcruntime140.dll cannot be used: Wine puts a builtin placeholder there.
# The installer is a WiX Burn bundle: it needs a window even with /quiet, so it only works because non-MSI
# installers run on Wine's null-driver desktop (see `install_installer`).
[[package]]
id = "vcrun2022"
version = "14.44.35211"
sha256 = "cc0ff0eb1dc3f5188ae6300faef32bf5beeba4bdd6e8e445a9184072096b713b"
size = 25635768
licence = "proprietary-redistributable"
url = "https://download.visualstudio.microsoft.com/download/pr/bd1c8d9d-ba95-4eee-bc6e-df1fcc876373/CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B/VC_redist.x64.exe"
kind = "installer"
requires_consent = true
requires = []
provides = [
    "concrt140",
    "mfc140",
    "mfc140u",
    "mfcm140",
    "mfcm140u",
    "msvcp140",
    "msvcp140_1",
    "msvcp140_2",
    "msvcp140_atomic_wait",
    "msvcp140_codecvt_ids",
    "vcamp140",
    "vccorlib140",
    "vcomp140",
    "vcruntime140",
    "vcruntime140_1",
    "vcruntime140_threads",
]

[package.install]
silent_args = ["/install", "/quiet", "/norestart"]
# Without these Wine 10.0 keeps loading its own builtin vcruntime140, msvcp140*, concrt140 and vcomp140 even
# though the native copies are installed (checked with WINEDEBUG=+loaddll); winetricks sets the same overrides.
dll_overrides = [
    "concrt140",
    "mfc140",
    "mfc140u",
    "mfcm140",
    "mfcm140u",
    "msvcp140",
    "msvcp140_1",
    "msvcp140_2",
    "msvcp140_atomic_wait",
    "msvcp140_codecvt_ids",
    "vcamp140",
    "vccorlib140",
    "vcomp140",
    "vcruntime140",
    "vcruntime140_1",
    "vcruntime140_threads",
]
# Bld (the build number) rather than Installed: VC++ 2015-2019 write the same key with Installed=1 but an older
# Bld and fewer DLLs, so an older runtime in the prefix must not count as this one (it is upgraded in place).
marker = { registry_value = { key = 'HKLM\Software\Microsoft\VisualStudio\14.0\VC\Runtimes\X64', name = "Bld", min_dword = 35211 } }

# Wine Mono 9.4.0 (the .NET Framework replacement; the `dotnet` capability), the MSI from dl.winehq.org. Verified by
# downloading on 2026-09-26 (84639232 bytes; the url's Content-Length agrees). Wine 10.0 (the Ubuntu repack checked)
# asks for exactly Mono 9.4.0 (wine-mono-9.4.0-x86.msi), so a Wine upgrade may need a new pin. The x86 MSI carries
# both the 32- and 64-bit runtimes; it is installed per app prefix (231 MiB) and also provides the C# compiler
# (lib/mono/4.5/csc.exe) the managed test fixture is built with. Installer: `msiexec /i <msi> /qn` (about 4 s,
# needs no window).
# marker: windows/mono/mono-2.0/bin/libmono-2.0-x86_64.dll; absent in a fresh Wine 10.0 prefix and present after a
# real `wine msiexec /i wine-mono-9.4.0-x86.msi /qn` (WINEDLLOVERRIDES=mscoree=d, so Wine's own prompt cannot run).
# licence: no single SPDX id; upstream's COPYING says Mono is variously GPL, LGPL and MIT X11 (all available as LGPL
# or MIT X11 except a few parts, e.g. SharpZipLib, GPL with an exception), the Visual Basic libraries and winforms
# are MIT, FNA is MSPL and MIT with zlib dependencies. The value lists those families within the validator's
# charset rather than claiming one id. Free software fetched from upstream on request, so no consent is required.
[[package]]
id = "wine-mono"
version = "9.4.0"
sha256 = "cf6173ae94b79e9de13d9a74cdb2560a886fc3d271f9489acb1cfdbd961cacb2"
size = 84639232
licence = "MIT AND LGPL AND GPL AND Zlib AND MS-PL"
url = "https://dl.winehq.org/wine/wine-mono/9.4.0/wine-mono-9.4.0-x86.msi"
kind = "installer"
requires_consent = false
requires = []
provides = ["dotnet"]

[package.install]
silent_args = ["/qn"]
marker = { file = "windows/mono/mono-2.0/bin/libmono-2.0-x86_64.dll" }
