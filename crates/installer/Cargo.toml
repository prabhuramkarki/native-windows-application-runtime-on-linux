[package]
name = "runtime-installer"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "rt_installer"

[dependencies]
runtime-core = { path = "../core" }
runtime-pe = { path = "../pe" }
runtime-desktop = { path = "../desktop" }
# The `sandbox-init` shim's argument block, Landlock rules and refusal (the same code as the app sandbox).
runtime-sandbox = { path = "../sandbox" }
thiserror.workspace = true
libc.workspace = true

[dev-dependencies]
# `FakeBackend` for the pipeline's logic tests (never part of a normal build); mirrors `crates/cli/Cargo.toml`.
runtime-core = { path = "../core", features = ["testing"] }
tempfile.workspace = true
